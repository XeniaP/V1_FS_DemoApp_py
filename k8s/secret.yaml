# IMPORTANT: Replace placeholder values with real base64-encoded secrets before applying.
# Generate base64: echo -n "YOUR_VALUE" | base64
#
# Required GitHub Actions secrets to set:
#   V1_API_KEY     - Trend Micro Vision One File Security API key
#   FLASK_SECRET_KEY - Random secret for Flask session signing
#
# Apply manually (do NOT commit with real values):
#   kubectl apply -f k8s/secret.yaml
#
# Recommended: use AWS Secrets Manager + External Secrets Operator instead of this file.
apiVersion: v1
kind: Secret
metadata:
  name: fs-demoapp-secrets
  namespace: fs-demoapp
  labels:
    app.kubernetes.io/name: fs-demoapp
type: Opaque
data:
  # echo -n "YOUR_V1_API_KEY" | base64
  V1_API_KEY: REPLACE_WITH_BASE64_ENCODED_API_KEY
  # echo -n "$(openssl rand -hex 32)" | base64
  FLASK_SECRET_KEY: REPLACE_WITH_BASE64_ENCODED_SECRET_KEY
