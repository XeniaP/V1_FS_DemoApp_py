apiVersion: apps/v1
kind: Deployment
metadata:
  name: fs-demoapp
  namespace: fs-demoapp
  labels:
    app.kubernetes.io/name: fs-demoapp
    app.kubernetes.io/version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fs-demoapp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fs-demoapp
    spec:
      serviceAccountName: fs-demoapp
      securityContext:
        runAsNonRoot: true
        fsGroup: 0
      containers:
        - name: app
          image: ghcr.io/xeniap/fs_demo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fs-demoapp-config
            - secretRef:
                name: fs-demoapp-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: fs-demoapp-uploads
        - name: tmp
          emptyDir: {}
